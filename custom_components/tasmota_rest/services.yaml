set_timer:
  name: Set Timer
  description: Configure a single Tasmota timer (1-16) on the targeted device(s).
  target:
    device:
      integration: tasmota_rest
  fields:
    timer_number:
      name: Timer number
      description: Timer slot 1-16. Tasmota supports up to 16 timers.
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    enable:
      name: Enable
      description: Enable (true) or disable (false) this timer slot.
      default: true
      selector:
        boolean:
    time:
      name: Time
      description: HH:MM (24h) when the timer fires.
      example: "06:30"
      selector:
        text:
    window:
      name: Random window (minutes)
      description: 0..15 minutes random window around Time.
      default: 0
      selector:
        number:
          min: 0
          max: 15
          mode: box
    days:
      name: Days bitmap
      description: 7-character bitmap, Sunday first (e.g. "1111111" = every day).
      default: "1111111"
      example: "1111100"
      selector:
        text:
    repeat:
      name: Repeat
      description: Repeat weekly.
      default: true
      selector:
        boolean:
    output:
      name: Output (relay)
      description: Relay number to control (1-8).
      default: 1
      selector:
        number:
          min: 1
          max: 8
          mode: box
    action:
      name: Action
      description: 0 = Off, 1 = On, 2 = Toggle, 3 = Rule.
      default: 1
      selector:
        number:
          min: 0
          max: 3
          mode: box

disable_all_timers:
  name: Disable all timers
  description: Disable Tasmota timers 1..count in a single Backlog.
  target:
    device:
      integration: tasmota_rest
  fields:
    count:
      name: Number of timers
      description: How many timer slots to disable (1..16).
      default: 6
      selector:
        number:
          min: 1
          max: 16
          mode: box

get_timers:
  name: Get timers
  description: >-
    Fetch the Timers JSON. Use response_variable to capture the result.
  target:
    device:
      integration: tasmota_rest

set_timezone:
  name: Set timezone
  description: Apply timezone configuration. Defaults to Europe/Berlin DST.
  target:
    device:
      integration: tasmota_rest
  fields:
    command:
      name: Custom Backlog command
      description: Optional override Backlog command.
      selector:
        text:

send_command:
  name: Send command
  description: Send any Tasmota command via /cm. Returns the parsed JSON response.
  target:
    device:
      integration: tasmota_rest
  fields:
    command:
      name: Command
      required: true
      example: "Status 11"
      selector:
        text:

backlog:
  name: Send Backlog
  description: Wraps the supplied semicolon-separated commands in Backlog0.
  target:
    device:
      integration: tasmota_rest
  fields:
    command:
      name: Backlog payload
      required: true
      example: "Power On; Delay 10; Power Off"
      selector:
        text:

restart:
  name: Restart device
  description: Reboot the Tasmota. Restart 1 keeps the relay state.
  target:
    device:
      integration: tasmota_rest
  fields:
    type:
      name: Restart type
      description: 1 = soft restart, 2 = factory reset, 99 = halt to bootloader.
      default: 1
      selector:
        number:
          min: 1
          max: 99
          mode: box

normalize_time:
  name: Normalize time
  description: Push HA's current local time to the Tasmota via the Time command.
  target:
    device:
      integration: tasmota_rest

power_on:
  name: Power on
  description: Turn the relay on (Power On).
  target:
    device:
      integration: tasmota_rest

power_off:
  name: Power off
  description: Turn the relay off (Power Off).
  target:
    device:
      integration: tasmota_rest

provision_ap:
  name: Provision Tasmota in AP mode
  description: >-
    Push WiFi credentials to a Tasmota currently broadcasting its own AP.
    Defaults to 192.168.4.1 (the Tasmota AP gateway). Stored hub credentials are
    used for any field left empty.
  fields:
    host:
      name: AP IP / hostname
      default: "192.168.4.1"
      selector:
        text:
    ssid:
      name: WiFi SSID
      description: Override the SSID stored in the hub.
      selector:
        text:
    password:
      name: WiFi password
      selector:
        text:
          type: password
    ssid2:
      name: Secondary SSID
      selector:
        text:
    password2:
      name: Secondary password
      selector:
        text:
          type: password
    hostname:
      name: Hostname
      description: Optional Tasmota hostname to set.
      selector:
        text:

provision_device:
  name: Push WiFi credentials to existing device
  description: Send the configured WiFi credentials to the targeted device(s) and reboot.
  target:
    device:
      integration: tasmota_rest
  fields:
    ssid:
      name: WiFi SSID
      selector:
        text:
    password:
      name: WiFi password
      selector:
        text:
          type: password
    ssid2:
      name: Secondary SSID
      selector:
        text:
    password2:
      name: Secondary password
      selector:
        text:
          type: password
    hostname:
      name: Hostname
      selector:
        text:

scan_now:
  name: Scan now
  description: Trigger an immediate LAN + AP + WiFi-environment scan.
