set_timer:
  name: Set Timer
  description: >-
    Configure a single Tasmota timer (1-16) on the targeted device(s).
    Sends a Timer<n> JSON command via HTTP.
  target:
    device:
      integration: tasmota_rest
  fields:
    timer_number:
      name: Timer number
      description: Timer slot 1-16. Tasmota supports up to 16 timers.
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    enable:
      name: Enable
      description: Enable (true) or disable (false) this timer slot.
      default: true
      selector:
        boolean:
    time:
      name: Time
      description: HH:MM (24h) when the timer fires.
      example: "06:30"
      selector:
        text:
    window:
      name: Random window (minutes)
      description: 0..15 minutes random window around Time.
      default: 0
      selector:
        number:
          min: 0
          max: 15
          mode: box
    days:
      name: Days bitmap
      description: 7-character bitmap, Sunday first (e.g. "1111111" = every day).
      default: "1111111"
      example: "1111100"
      selector:
        text:
    repeat:
      name: Repeat
      description: Repeat weekly.
      default: true
      selector:
        boolean:
    output:
      name: Output (relay)
      description: Relay number to control (1-8).
      default: 1
      selector:
        number:
          min: 1
          max: 8
          mode: box
    action:
      name: Action
      description: 0 = Off, 1 = On, 2 = Toggle, 3 = Rule.
      default: 1
      selector:
        number:
          min: 0
          max: 3
          mode: box

disable_all_timers:
  name: Disable all timers
  description: Disable all Tasmota timers (1..count) in a single Backlog.
  target:
    device:
      integration: tasmota_rest
  fields:
    count:
      name: Number of timers
      description: How many timer slots to disable (1..16).
      default: 6
      selector:
        number:
          min: 1
          max: 16
          mode: box

get_timers:
  name: Get timers
  description: >-
    Fetch the Timers JSON from the targeted Tasmota device(s).
    Use response variables to capture the result.
  target:
    device:
      integration: tasmota_rest

set_timezone:
  name: Set timezone
  description: >-
    Apply the timezone configuration to the device. Uses the European DST
    defaults unless an override Backlog command is supplied.
  target:
    device:
      integration: tasmota_rest
  fields:
    command:
      name: Custom Backlog command
      description: >-
        Optional override; defaults to:
        Backlog0 Timezone 99; TimeStd 0,0,10,1,3,60; TimeDst 0,0,3,1,2,120
      selector:
        text:

send_command:
  name: Send command
  description: Send any Tasmota command via /cm. Returns the parsed JSON response.
  target:
    device:
      integration: tasmota_rest
  fields:
    command:
      name: Command
      description: Command sent verbatim to the Tasmota /cm endpoint.
      required: true
      example: "Status 11"
      selector:
        text:

backlog:
  name: Send Backlog
  description: >-
    Convenience wrapper that sends the supplied semicolon-separated commands
    via Backlog0 (no inter-command delay).
  target:
    device:
      integration: tasmota_rest
  fields:
    command:
      name: Backlog payload
      description: One or more commands separated by semicolons.
      required: true
      example: "Power On; Delay 10; Power Off"
      selector:
        text:

restart:
  name: Restart device
  description: Reboot the Tasmota device. Restart 1 reboots without changing relay state.
  target:
    device:
      integration: tasmota_rest
  fields:
    type:
      name: Restart type
      description: 1 = soft restart (default), 99 = halt to bootloader, 2 = factory reset.
      default: 1
      selector:
        number:
          min: 1
          max: 99
          mode: box

normalize_time:
  name: Normalize time
  description: >-
    Push Home Assistant's current local time to the Tasmota device using
    the Time command. Useful when NTP is unreliable on the device.
  target:
    device:
      integration: tasmota_rest

power_on:
  name: Power on
  description: Turn the relay on (Power On).
  target:
    device:
      integration: tasmota_rest

power_off:
  name: Power off
  description: Turn the relay off (Power Off).
  target:
    device:
      integration: tasmota_rest
